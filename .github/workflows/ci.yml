name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    name: Lint, Typecheck, Ratchet & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Code Style & Quality Lint
        run: npm run lint

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Quality Ratchet Verification
        run: npm run ratchet

      - name: Vitest Suite (Unit & Integration)
        run: npm test
