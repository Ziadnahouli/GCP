[package]
name = "nexus-desktop"
version = "0.2.0"
description = "Nexus Gaming Communication Platform Windows Companion"
authors = ["Nexus Team"]
license = "MIT"
repository = "https://github.com/nexus/gaming"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "shell-open", "notification", "global-shortcut" ] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
