[package]
name = "nexus-desktop"
version = "0.2.0"
description = "Nexus Gaming Communication Platform Windows Companion & Rust Microservice"
authors = ["Nexus Team"]
license = "MIT"
repository = "https://github.com/nexus/gaming"
edition = "2021"

[[bin]]
name = "main"
path = "src/main.rs"

[dependencies]
vercel_runtime = "1.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "1.5", features = [ "shell-open", "notification", "global-shortcut" ], optional = true }

[build-dependencies]
tauri-build = { version = "1.5", optional = true }

[features]
default = ["vercel"]
vercel = []
desktop = ["tauri", "tauri-build"]
