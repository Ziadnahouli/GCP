<!DOCTYPE html>
<html>
<head>
  <title>LiveKit Cloud SFU Room Test</title>
  <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
  <style>
    body { font-family: monospace; background: #0b0f17; color: #10b981; padding: 24px; }
    pre { background: #111827; padding: 16px; border-radius: 8px; border: 1px solid #1f2937; color: #e5e7eb; overflow: auto; max-height: 400px; }
    button { background: #059669; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    button:hover { background: #10b981; }
  </style>
</head>
<body>
  <h1>LiveKit Cloud Room Diagnostics</h1>
  <button id="btn" onclick="testConnection()">Connect LiveKit Cloud Room</button>
  <pre id="logs">Click button to test LiveKit Cloud SFU connection...</pre>

  <script>
    const logsEl = document.getElementById('logs');
    function log(msg) {
      logsEl.innerText += '\n' + new Date().toISOString().slice(11, 19) + ' ' + msg;
      console.log(msg);
    }

    async function testConnection() {
      try {
        log('1. Fetching token from /api/calls/token...');
        const res = await fetch('/api/calls/token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            roomName: 'nexus-lounge-diagnostics',
            userId: 'user-diagnostics-' + Math.random().toString(36).slice(2, 7),
            userName: 'DiagnosticsGamer'
          })
        });
        const data = await res.json();
        log('2. Token response received: isConfigured=' + data.isConfigured + ', url=' + data.url + ', room=' + data.roomName);

        if (!data.token || !data.url) {
          log('ERROR: Missing token or url from server!');
          return;
        }

        log('3. Initializing LiveKit Room with livekit-client...');
        const room = new LivekitClient.Room({
          adaptiveStream: true,
          dynacast: true,
          disconnectOnPageLeave: false,
        });

        room.on(LivekitClient.RoomEvent.Connected, () => {
          log('SUCCESS: LiveKit RoomEvent.Connected fired! Room is now ACTIVE in LiveKit Cloud!');
          log('Room Name: ' + room.name);
          log('Connection State: ' + room.state);
        });

        room.on(LivekitClient.RoomEvent.Disconnected, (reason) => {
          log('NOTICE: RoomEvent.Disconnected: ' + reason);
        });

        log('4. Connecting to LiveKit Cloud at ' + data.url + '...');
        await room.connect(data.url, data.token);
        log('5. await room.connect resolved successfully! Room SID: ' + (await room.getSid()));
      } catch (err) {
        log('FATAL ERROR during LiveKit test: ' + (err.stack || err.message || err));
      }
    }
  </script>
</body>
</html>
